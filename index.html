<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>研究室 3Dレイアウト (Ver 9.1)</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #e6f0f9">

    <!-- 1. 床 (7.245m x 7.630m) -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="7.245" height="7.630" color="#B0C4DE"></a-plane>
    <!-- 天井 (高さ2.7m) -->
    <a-plane position="0 2.7 0" rotation="90 0 0" width="7.245" height="7.630" color="#F8F8FF" opacity="0.8"></a-plane>

    <!-- 2. 壁面 (簡易表現) -->
    <!-- 北壁 (窓側: 半透明) -->
    <a-box position="0 1.35 -3.815" width="7.245" height="2.7" depth="0.05" color="#E0FFFF" opacity="0.3"></a-box>
    <!-- 南壁 (廊下側) -->
    <a-box position="0 1.35 3.815" width="7.245" height="2.7" depth="0.05" color="#F5F5DC"></a-box>
    <!-- 東西壁 -->
    <a-box position="-3.62 1.35 0" width="0.05" height="2.7" depth="7.630" color="#F5F5DC"></a-box>
    <a-box position="3.62 1.35 0" width="0.05" height="2.7" depth="7.630" color="#F5F5DC"></a-box>

    <!-- 3. 北側 造作壁 & 75インチモニター -->
    <a-box position="0 1.35 -3.715" width="2.4" height="2.7" depth="0.2" color="#FFFFFF"></a-box>
    <a-plane position="0 1.5 -3.61" width="1.6" height="0.9" color="#111111"></a-plane> <!-- モニター -->

    <!-- 4. 中央ディスカッションテーブル (W1200 x D2600) -->
    <a-box position="0 0.35 0" width="1.2" height="0.7" depth="2.6" color="#DEB887"></a-box>

    <!-- 5. 【北西】准教授 一体型L字デスク (W1800 x D1400) -->
    <!-- メイン天板 -->
    <a-box position="-2.72 0.35 -3.415" width="1.8" height="0.7" depth="0.8" color="#654321"></a-box>
    <!-- サイド天板 -->
    <a-box position="-3.32 0.35 -2.415" width="0.6" height="0.7" depth="1.2" color="#654321"></a-box>

    <!-- 6. 【北窓側】コピー機 -->
    <a-box position="-1.5 0.5 -3.515" width="0.6" height="1.0" depth="0.6" color="#EEEEEE"></a-box>

    <!-- 7. 【西側】学生デスク①〜③ & 半透明パーテーション -->
    <a-box position="-3.27 0.35 -1.065" width="0.7" height="0.7" depth="1.5" color="#FDFDFD"></a-box> <!-- ① -->
    <a-box position="-3.27 0.35 0.435" width="0.7" height="0.7" depth="1.5" color="#FDFDFD"></a-box> <!-- ② -->
    <a-box position="-3.27 0.35 2.085" width="0.7" height="0.7" depth="1.8" color="#FDFDFD"></a-box> <!-- ③(特大) -->

    <!-- 西側パーテーション (W900 H1800) -->
    <a-box position="-3.17 0.9 -1.815" width="0.9" height="1.8" depth="0.02" color="#ADD8E6" opacity="0.5"></a-box>
    <a-box position="-3.17 0.9 -0.315" width="0.9" height="1.8" depth="0.02" color="#ADD8E6" opacity="0.5"></a-box>
    <a-box position="-3.17 0.9 1.185" width="0.9" height="1.8" depth="0.02" color="#ADD8E6" opacity="0.5"></a-box>
    <a-box position="-3.17 0.9 2.985" width="0.9" height="1.8" depth="0.02" color="#ADD8E6" opacity="0.5"></a-box>

    <!-- 8. 【東側】学生デスク④〜⑥ & 半透明パーテーション -->
    <a-box position="3.27 0.35 -1.565" width="0.7" height="0.7" depth="1.5" color="#FDFDFD"></a-box> <!-- ④ -->
    <a-box position="3.27 0.35 -0.065" width="0.7" height="0.7" depth="1.5" color="#FDFDFD"></a-box> <!-- ⑤ -->
    <a-box position="3.27 0.35 1.435" width="0.7" height="0.7" depth="1.5" color="#FDFDFD"></a-box> <!-- ⑥ -->

    <!-- 東側パーテーション (W900 H1800) -->
    <a-box position="3.17 0.9 -2.315" width="0.9" height="1.8" depth="0.02" color="#ADD8E6" opacity="0.5"></a-box> <!-- カフェ側遮断 -->
    <a-box position="3.17 0.9 -0.815" width="0.9" height="1.8" depth="0.02" color="#ADD8E6" opacity="0.5"></a-box>
    <a-box position="3.17 0.9 0.685" width="0.9" height="1.8" depth="0.02" color="#ADD8E6" opacity="0.5"></a-box>
    <a-box position="3.17 0.9 2.185" width="0.9" height="1.8" depth="0.02" color="#ADD8E6" opacity="0.5"></a-box>

    <!-- 9. 【北東】洗面台 & カフェ・電子レンジラック -->
    <a-box position="3.02 0.4 -3.515" width="1.2" height="0.8" depth="0.6" color="#E0E0E0"></a-box> <!-- 洗面台 -->
    <a-box position="1.97 0.45 -3.59" width="0.9" height="0.9" depth="0.45" color="#D2B48C"></a-box> <!-- カフェラック -->

    <!-- 10. 【南側】4連収納ウォール (W3600 x D450 x H1800) -->
    <a-box position="0.92 0.9 3.59" width="3.6" height="1.8" depth="0.45" color="#778899"></a-box>

    <!-- 11. 【南西】ディープフリーザー & サーバーラック -->
    <a-box position="-3.17 0.9 3.39" width="0.9" height="1.8" depth="0.85" color="#999999"></a-box>

    <!-- 照明 -->
    <a-light type="ambient" color="#FFFFFF" intensity="0.7"></a-light>
    <a-light type="directional" position="-2 4 3" intensity="0.5"></a-light>

    <!-- カメラ（南東のメイン出入口を入った直後の視点からスタート） -->
    <a-entity position="2.5 1.5 3.3" rotation="0 45 0">
      <a-camera look-controls wasd-controls></a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
